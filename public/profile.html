<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Profile</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="navbar">
    My Profile
</div>

<div class="container">

<div class="card">

<h2 id="username"></h2>
<button onclick="logout()">Logout</button>

</div>

</div>

<script>

const token = localStorage.getItem("token");

if(!token){
    window.location.href = "/login.html";
}

function logout(){
    localStorage.removeItem("token");
    window.location.href = "/login.html";
}

</script>

</body>
</html>
