<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DarkForum</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="navbar">
    DarkForum
</div>

<div class="container">

<div class="card">

<h1>Welcome to DarkForum</h1>

<p>
Modern community forum with posts, comments,
profiles and admin panel.
</p>

<div class="card">

<h2>Forum Stats</h2>

<p id="stats"></p>

</div>

<a href="/login.html">
<button>Login</button>
</a>

<a href="/register.html">
<button>Create Account</button>
</a>

</div>

<div id="forum"></div>

</div>

<script>

const token = localStorage.getItem("token");

loadStats();

if(token){

    loadForum();

}

let allPosts = [];

async function loadForum(){

    const forum = document.getElementById("forum");

    forum.innerHTML = `

    <div class="card">

    <h2>Create Post</h2>

    <input type="text"
    id="title"
    placeholder="Post title">

    <select id="category">

    <option>General</option>

    <option>Games</option>

    <option>Technology</option>

    <option>News</option>

    <option>Off Topic</option>

    </select>

    <textarea id="content"
    placeholder="Write something..."></textarea>

    <input type="text"
    id="search"
    placeholder="Search posts..."
    onkeyup="searchPosts()">

    <select id="filter"
    onchange="filterCategory()">

    <option value="All">
    All Categories
    </option>

    <option value="General">
    General
    </option>

    <option value="Games">
    Games
    </option>

    <option value="Technology">
    Technology
    </option>

    <option value="News">
    News
    </option>

    <option value="Off Topic">
    Off Topic
    </option>

    </select>

    <button onclick="createPost()">

    Publish

    </button>

    <a href="/profile.html">
    <button>Profile</button>
    </a>

    <a href="/users.html">
    <button>Users</button>
    </a>

    <a href="/admin.html">
    <button>Admin</button>
    </a>

    <a href="/notifications.html">
    <button>Notifications</button>
    </a>

    <button onclick="logout()">
    Logout
    </button>

    </div>

    <div id="posts"></div>

    `;

    loadPosts();

}

const user =
token ? JSON.parse(atob(token.split(".")[1])) : null;

async function loadPosts(){

    const res = await fetch("/api/posts");

    const posts = await res.json();

    allPosts = posts;

    const div = document.getElementById("posts");

    div.innerHTML = "";

    posts.forEach(post=>{

        div.innerHTML += `

        <div class="card">

            <div style="display:flex;align-items:center;gap:15px;">

                <img src="/uploads/${user.avatar}"
                width="60"
                height="60"
                style="border-radius:50%;object-fit:cover;">

                <div>

                    <h3>${post.author}</h3>

                    <small>

                    ${post.title}

                    - ${post.category}

                    </small>

                </div>

            </div>

            <p>${post.content}</p>

            <small>
            ${new Date(post.createdAt).toLocaleString()}
            </small>

            <hr>

            <input type="text"
            id="comment-${post._id}"
            placeholder="Write comment">

            <button onclick="addComment('${post._id}')">

                Comment

            </button>

            <div id="comments-${post._id}"></div>

        </div>

        `;

        loadComments(post._id);

    });

}

async function createPost(){

    await fetch("/api/posts",{

        method:"POST",

        headers:{
            "Content-Type":"application/json",
            "Authorization":token
        },

        body:JSON.stringify({

            title:document.getElementById("title").value,

            content:document.getElementById("content").value,

            category:document.getElementById("category").value

        })

    });

    loadPosts();

    loadStats();

}

async function addComment(postId){

    const content =
    document.getElementById(`comment-${postId}`).value;

    await fetch("/api/comments",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            postId,

            author:user.username,

            content

        })

    });

    loadComments(postId);

}

async function loadComments(postId){

    const res =
    await fetch(`/api/comments/${postId}`);

    const comments = await res.json();

    const div =
    document.getElementById(`comments-${postId}`);

    div.innerHTML = "";

    comments.forEach(comment=>{

        div.innerHTML += `

        <p>

        <b>${comment.author}:</b>

        ${comment.content}

        <br>

        <small>
        ${new Date(comment.createdAt).toLocaleString()}
        </small>

        </p>

        `;

    });

}

function searchPosts(){

    const value =
    document.getElementById("search")
    .value
    .toLowerCase();

    const filtered = allPosts.filter(post =>

        post.title.toLowerCase().includes(value) ||

        post.content.toLowerCase().includes(value)

    );

    const div = document.getElementById("posts");

    div.innerHTML = "";

    filtered.forEach(post=>{

        div.innerHTML += `

        <div class="card">

            <h2>${post.title}</h2>

            <p>${post.content}</p>

            <small>${post.author}</small>

        </div>

        `;

    });

}

function filterCategory(){

    const category =
    document.getElementById("filter").value;

    const div =
    document.getElementById("posts");

    div.innerHTML = "";

    const filtered =
    category === "All"

    ? allPosts

    : allPosts.filter(post =>

        post.category === category

    );

    filtered.forEach(post=>{

        div.innerHTML += `

        <div class="card">

            <h2>${post.title}</h2>

            <p>${post.content}</p>

            <small>

            ${post.author}

            - ${post.category}

            </small>

        </div>

        `;

    });

}

async function loadStats(){

    const postsRes =
    await fetch("/api/posts");

    const posts =
    await postsRes.json();

    const usersRes =
    await fetch("/api/users");

    const users =
    await usersRes.json();

    document.getElementById("stats")
    .innerHTML =

    `
    Members: ${users.length}
    <br>
    Posts: ${posts.length}
    `;

}

function logout(){

    localStorage.removeItem("token");

    window.location.href = "/";

}

</script>

</body>
</html>
