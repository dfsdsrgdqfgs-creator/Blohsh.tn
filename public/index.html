<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DarkForum</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="navbar">
    DarkForum
</div>

<div class="container">

<div class="card">

<h2>Create Post</h2>

<input type="text" id="title" placeholder="Post title">

<textarea id="content" placeholder="Write something..."></textarea>

<button onclick="createPost()">Publish</button>

<a href="/profile.html">
<button>Profile</button>
</a>

</div>

<div id="posts"></div>

</div>

<script>

const token = localStorage.getItem("token");

if(!token){
    window.location.href = "/login.html";
}

async function loadPosts(){

    const res = await fetch("/api/posts");

    const posts = await res.json();

    const div = document.getElementById("posts");

    div.innerHTML = "";

    posts.forEach(post=>{

        div.innerHTML += `
        <div class="card">

            <h2>${post.title}</h2>

            <p>${post.content}</p>

            <small>By ${post.author}</small>

            <hr>

            <input type="text" id="comment-${post._id}" placeholder="Write comment">

            <button onclick="addComment('${post._id}')">Comment</button>

            <div id="comments-${post._id}"></div>

        </div>
        `;

        loadComments(post._id);

    });

}

async function createPost(){

    await fetch("/api/posts",{

        method:"POST",

        headers:{
            "Content-Type":"application/json",
            "Authorization":token
        },

        body:JSON.stringify({

            title:document.getElementById("title").value,
            content:document.getElementById("content").value

        })

    });

    loadPosts();

}

async function addComment(postId){

    const user = JSON.parse(atob(token.split(".")[1]));

    const content = document.getElementById(`comment-${postId}`).value;

    await fetch("/api/comments",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            postId,
            author:user.username,
            content

        })

    });

    loadComments(postId);

}

async function loadComments(postId){

    const res = await fetch(`/api/comments/${postId}`);

    const comments = await res.json();

    const div = document.getElementById(`comments-${postId}`);

    div.innerHTML = "";

    comments.forEach(comment=>{

        div.innerHTML += `
        <p><b>${comment.author}:</b> ${comment.content}</p>
        `;

    });

}

loadPosts();

</script>

</body>
</html>
